<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>kinetic fields live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; min-height: 100dvh; background: #000; overflow: hidden; overscroll-behavior: none; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { margin: 0; padding: 0; }
canvas#glc { position: fixed; inset: 0; width: 100%; height: 100%; display: block; contain: strict; touch-action: none; }

#wordmark { cursor: pointer; -webkit-tap-highlight-color: transparent; position: fixed; top: 26px; left: clamp(14px, 3vw, 32px); z-index: 20; pointer-events: none;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 900;
  letter-spacing: 0; color: rgba(255,255,255,0.45); }
#freq-wrap { position: fixed; top: 22px; right: clamp(14px, 3vw, 32px); z-index: 20; text-align: right; pointer-events: none; }
#freq-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.22); }
#freq-val   { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.6); }

#mic-wrap { position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  z-index: 20; display: flex; align-items: center; gap: 8px; }
#mic-dot { width: 7px; height: 7px; border-radius: 50%; background: transparent;
  transition: background 0.4s, box-shadow 0.4s; flex-shrink: 0; }
#mic-dot.live { background: #50ffa0; box-shadow: 0 0 10px #50ffa0; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
#mic-btn { cursor: pointer; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.6);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8px; letter-spacing: 0.2em;
  padding: 8px 20px; border-radius: 30px; text-transform: uppercase; transition: all 0.3s; }
#mic-btn:hover { border-color: rgba(255,255,255,0.7); color: #fff; background: rgba(255,255,255,0.1); }
#mic-btn.live { border-color: rgba(80,255,160,0.5); color: rgba(80,255,160,0.9); background: rgba(80,255,160,0.06); cursor: default; }

#ui { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; gap: 7px; padding-bottom: clamp(10px, 2vw, 18px);
  touch-action: pan-y; pointer-events: auto; }
.row { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: center;
  background: rgba(0,0,0,0.72); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 40px; padding: 5px 10px; backdrop-filter: blur(20px);
  pointer-events: auto; }
.row-lbl { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 7px; letter-spacing: 0.18em;
  color: rgba(255,255,255,0.2); text-transform: uppercase; padding: 0 6px; white-space: nowrap; }
.t { cursor: pointer; background: transparent; border: none;
  color: rgba(255,255,255,0.35); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  padding: 7px 10px; border-radius: 28px; text-transform: uppercase; transition: all 0.2s; white-space: nowrap;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; pointer-events: auto; }
.t:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.07); }
.t.on { background: rgba(255,255,255,0.13); color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.1); }
.vd { width: 1px; height: 15px; background: rgba(255,255,255,0.08); flex-shrink: 0; margin: 0 2px; }
.sg { display: flex; align-items: center; gap: 6px; padding: 2px 5px;
  touch-action: none; pointer-events: auto; }
.sg span { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 7px; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.22); text-transform: uppercase; min-width: 44px; }
.sg .val { min-width: 28px; text-align: right; color: rgba(255,255,255,0.4); font-size: 9px; }
/* Expanded vertical hit-area via padding trick; touch-action:none lets slider capture drag exclusively */
input[type=range] { -webkit-appearance: none; width: 64px; height: 20px;
  background: transparent; border-radius: 2px; outline: none; cursor: pointer;
  touch-action: none; pointer-events: auto; -webkit-tap-highlight-color: transparent;
  padding: 0; margin: 0; box-sizing: border-box; }
input[type=range]::-webkit-slider-runnable-track { height: 2px;
  background: rgba(255,255,255,0.15); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px;
  border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 6px rgba(255,255,255,0.4);
  margin-top: -10px; }
input[type=range]::-moz-range-track { height: 2px;
  background: rgba(255,255,255,0.15); border-radius: 2px; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px;
  border-radius: 50%; background: #fff; border: none; box-shadow: 0 0 6px rgba(255,255,255,0.4); }

#auto-vj-status {
  position: fixed;
  top: 62px;
  left: 50%;
  right: auto;
  transform: translateX(-50%);
  z-index: 25;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 168px;
  height: 32px;
  padding: 0 14px;

  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 8px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.14em;
  text-align: center;
  white-space: nowrap;
  text-transform: uppercase;

  color: rgba(255,255,255,0.45);
  cursor: pointer;
  pointer-events: auto;

  transition: opacity 0.35s, color 0.25s, border-color 0.25s, box-shadow 0.25s, background 0.25s;
}
#auto-vj-status.active {
  color: rgba(80,255,160,0.95);
  border-color: rgba(80,255,160,0.35);
  box-shadow: 0 0 20px rgba(80,255,160,0.15);
}
#mode-transition {
  position: fixed;
  inset: 0;
  z-index: 19;
  pointer-events: none;
  background: #000;
  opacity: 0;
  transition: opacity 180ms ease;
}
#mode-transition.active {
  opacity: 0.42;
}

/* Mobile text-color toggle button */
#mobile-text-color-btn {
  display: none;
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  z-index: 30;
  margin: 10px 0 0 12px;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  color: rgba(255,255,255,0.8);
  font-size: 15px;
  font-weight: 800;
  line-height: 1;
  font-family: 'Funnel Sans', Inter, system-ui, sans-serif;
  transition: background 0.2s, color 0.2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#mobile-text-color-btn:active { background: rgba(255,255,255,0.12); }
#mobile-text-color-btn.text-white { color: rgba(255,255,255,0.9); }
#mobile-text-color-btn.text-black { color: rgba(0,0,0,0.0); text-shadow: 0 0 0 rgba(255,255,255,0.7); background: rgba(255,255,255,0.45); }
.ui-hidden { opacity: 0 !important; pointer-events: none !important; transition: opacity 0.4s; }
#ui, #mic-wrap, #wordmark, #freq-wrap { transition: opacity 0.4s; }

#mobile-hide-btn {
  display: none;
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  right: 0;
  z-index: 30;
  margin: 10px 12px 0 0;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  line-height: 1;
  transition: background 0.2s, color 0.2s, opacity 0.3s;
  -webkit-tap-highlight-color: transparent;
}
#mobile-hide-btn:active { background: rgba(255,255,255,0.12); }
#mobile-hide-btn.ui-shown { color: rgba(255,255,255,0.45); }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.018) 2px,rgba(0,0,0,0.018) 4px); }

#center-fields {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 12;
  pointer-events: none;
  user-select: none;
  text-align: center;
  font-family: 'Funnel Sans', Inter, system-ui, sans-serif;
  font-size: var(--fields-font-size, 11vw) !important;
  line-height: 0.78;
  font-weight: 900;
  letter-spacing: -0.075em;
  text-transform: lowercase;
  color: #000000;
  -webkit-text-stroke: 0px transparent;
  mix-blend-mode: normal;
  opacity: 1;
  white-space: nowrap;
  width: max-content;
  max-width: none;
  overflow: visible;
  text-shadow: none !important;
  filter: none !important;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  transition: opacity 0.35s ease;
}
#center-fields.fields-hidden {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.98);
}

#ui .row:first-child {
  max-width: calc(100vw - 16px);
  overflow-x: auto;
  justify-content: flex-start;
  scrollbar-width: none;
}
#ui .row:first-child::-webkit-scrollbar { display: none; }

@media (max-width: 768px) {
  #auto-vj-status {
    top: calc(env(safe-area-inset-top, 0px) + 52px);
    font-size: 7px;
    padding: 6px 10px;
  }

  #wordmark { cursor: pointer; -webkit-tap-highlight-color: transparent;
    top: 14px;
    left: 14px;
    font-size: 13px;
    opacity: 0.8;
  }

  #freq-wrap {
    top: 14px;
    right: 14px;
  }

  #freq-label {
    font-size: 7px;
    letter-spacing: 0.14em;
  }

  #freq-val {
    font-size: 14px;
  }

  #mic-wrap {
    top: 12px;
    gap: 6px;
  }

  #mic-btn {
    font-size: 7px;
    padding: 7px 12px;
  }

  #ui {
    padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
    gap: 5px;
    max-height: calc(65dvh - env(safe-area-inset-bottom, 16px));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    pointer-events: auto;
  }

  #mobile-hide-btn {
    display: flex;
  }

  #mobile-text-color-btn {
    display: flex;
  }

  /* All rows scroll horizontally — no wrapping, buttons stay on one line */
  .row {
    max-width: calc(100vw - 16px);
    padding: 5px 7px;
    border-radius: 22px;
    gap: 2px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: visible;
    justify-content: flex-start;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .row::-webkit-scrollbar { display: none; }

  .row-lbl {
    font-size: 6px;
    letter-spacing: 0.14em;
    padding: 0 4px;
  }

  .t {
    font-size: 9px;
    padding: 6px 7px;
    letter-spacing: 0.02em;
  }

  .vd {
    height: 11px;
    margin: 0 1px;
  }

  .sg {
    gap: 4px;
    padding: 1px 3px;
  }

  .sg span {
    font-size: 6px;
    min-width: 34px;
  }

  .sg .val {
    min-width: 24px;
    font-size: 7px;
  }

  input[type=range] {
    width: 54px;
    height: 20px;
  }

  input[type=range]::-webkit-slider-thumb {
    width: 26px;
    height: 26px;
    margin-top: -12px;
  }

  input[type=range]::-moz-range-thumb {
    width: 26px;
    height: 26px;
  }

  #center-fields {
    -webkit-text-stroke: 0.75px rgba(255, 255, 255, 0.04);
    line-height: 0.82;
  }
}

@media (max-width: 480px) {
  #wordmark,
  #freq-wrap {
    display: none;
  }

  #mic-wrap {
    top: calc(env(safe-area-inset-top, 0px) + 10px);
  }

  #ui {
    max-height: calc(65dvh - env(safe-area-inset-bottom, 16px));
    padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
    padding-left: 6px;
    padding-right: 6px;
  }

  .row {
    max-width: calc(100vw - 12px);
    flex-wrap: nowrap;
    overflow-x: auto;
    justify-content: flex-start;
    scrollbar-width: none;
  }
  .row::-webkit-scrollbar { display: none; }

  .t {
    font-size: 8px;
    padding: 6px 6px;
  }

  input[type=range] {
    width: 48px;
    height: 20px;
  }

  input[type=range]::-webkit-slider-thumb {
    width: 28px;
    height: 28px;
    margin-top: -13px;
  }

  input[type=range]::-moz-range-thumb {
    width: 28px;
    height: 28px;
  }
}

</style>
</head>
<body>
<div id="mode-transition"></div>
<canvas id="glc"></canvas>
<canvas id="viz-canvas" style="position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:8;background:transparent;contain:strict;touch-action:none"></canvas>
<canvas id="fluid-canvas" style="position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:2;contain:strict;touch-action:none"></canvas>
<canvas id="bio-canvas"   style="position:fixed;inset:0;width:100%;height:100%;display:none;z-index:8;contain:strict;touch-action:none"></canvas>
<canvas id="tiedye-canvas" style="position:fixed;inset:0;width:100%;height:100%;display:none;z-index:8;contain:strict;touch-action:none"></canvas>
<canvas id="pulse-canvas" style="position:fixed;inset:0;width:100%;height:100%;display:none;z-index:8;contain:strict;touch-action:none"></canvas>
<div id="wordmark" style="cursor:pointer;user-select:none" onclick="toggleFieldsColor()">kinetic fields live</div>
<div id="center-fields">kinetic fields</div>
<div id="freq-wrap"><div id="freq-label">FREQUENCY</div><div id="freq-val">—</div></div>
<div id="mic-wrap"><div id="mic-dot"></div><button id="mic-btn">ACTIVATE MIC</button></div>
<div id="auto-vj-status">AUTO VJ INACTIVE</div>
<button id="mobile-hide-btn" class="ui-shown" aria-label="Toggle UI">⊙</button>
<button id="mobile-text-color-btn" aria-label="Toggle text color">A</button>

<div id="ui">

  <div class="row" id="mic-gain-row">
    <span class="row-lbl">MIC INPUT</span>
    <div class="sg">
      <span>GAIN</span>
      <input type="range" id="micGainSl" min="0" max="300" value="100" step="1">
      <span class="val" id="micGainVal">1.00x</span>
    </div>
  </div>


  <!-- Row 1: MODE -->
  <div class="row">
    <span class="row-lbl">MODE</span>
    <button class="t on" id="btn-ripple" onclick="setMode('ripple')">⌁ FLUID</button>
    <div class="vd"></div>
    <button class="t"    id="btn-liquidmetal" onclick="setMode('liquidmetal')">◒ LIQUID METAL</button>
    <div class="vd"></div>
    <button class="t"    id="btn-lightning" onclick="setMode('lightning')">ϟ LIGHTNING</button>
    <div class="vd"></div>

    <button class="t"    id="btn-ascii" onclick="setMode('ascii')">▦ ASCII</button>
    <div class="vd"></div>


    <button class="t"    id="btn-orb"    onclick="setMode('orb')">⬡ ORB BLOB</button>
    <div class="vd"></div>
    <button class="t"    id="btn-metal"  onclick="setMode('metal')">⬢ METAL SPHERE</button>
    <div class="vd"></div>
    <button class="t"    id="btn-bio"    onclick="setMode('bio')">⋯ BIOLUMINESCENCE</button>
    <div class="vd"></div>
    <button class="t"    id="btn-osc" onclick="setMode('osc')">⌇ OSC</button>
    <div class="vd"></div>
    <button class="t"    id="btn-fft" onclick="setMode('fft')">⌉ FFT</button>

    <div class="vd"></div>
    <button class="t"    id="btn-lissajous" onclick="setMode('lissajous')">⌀ ARC REACTOR</button>
    <div class="vd"></div>
    <button class="t"    id="btn-retrowave" onclick="setMode('retrowave')">⌗ RETRO</button>
    <div class="vd"></div>
    <button class="t"    id="btn-star" onclick="setMode('star')">✧ STAR</button>
    <div class="vd"></div>
    <button class="t"    id="btn-iris"  onclick="setMode('iris')">⌬ IRIS</button>
    <div class="vd"></div>
    <button class="t"    id="btn-pulse" onclick="setMode('pulse')">◉ PULSE</button>
    <div class="vd"></div>
    <button class="t"    id="btn-tiedye" onclick="setMode('tiedye')">◈ TIE DYE</button>
  </div>

  <!-- Row 2: TEXTURE — shared across orb + ripple -->
  <div class="row" id="tex-row">
    <span class="row-lbl">TEXTURE</span>
    <button class="t on" id="tx0" onclick="setTex(0)">RAINBOW</button>
    <div class="vd"></div>
    <button class="t"    id="tx1" onclick="setTex(1)">FIRE</button>
    <div class="vd"></div>
    <button class="t"    id="tx2" onclick="setTex(2)">ELECTRIC</button>
    <div class="vd"></div>
    <button class="t"    id="tx3" onclick="setTex(3)">PRISM</button>
    <div class="vd"></div>
    <button class="t"    id="tx4" onclick="setTex(4)">NEON</button>
    <div class="vd"></div>
    <button class="t"    id="tx5" onclick="setTex(5)">UV</button>
    <div class="vd"></div>
    <button class="t"    id="tx6" onclick="setTex(6)">VINTAGE</button>
  </div>

  <!-- Row 3: SHAPE (orb) / MATERIAL (metal) / DENSITY (ripple) -->
  <div class="row">
    <span class="row-lbl" id="shape-lbl">SHAPE</span>

    <!-- ORB BLOB controls -->
    <span id="orb-ctrls">
      <button class="t on" id="wireBtn"  onclick="setWire(true)">WIRE</button>
      <button class="t"    id="solidBtn" onclick="setWire(false)">SOLID</button>
      <div class="vd"></div>
      <div class="sg"><span>DETAIL</span><input type="range" id="detailSl" min="1" max="8" value="3" step="1"></div>
      <div class="vd"></div>
    </span>

    <!-- METAL SPHERE controls: type buttons hidden, params in dedicated row -->
    <!-- RIPPLE controls: size/density only -->
    <span id="rip-ctrls" style="display:none;align-items:center;gap:4px">
      <div class="sg"><span>SIZE</span><input type="range" id="fSizeSl" min="1" max="100" value="30" step="1"></div>
      <div class="vd"></div>
      <div class="sg"><span>DENSITY</span><input type="range" id="fDensitySl" min="1" max="100" value="28" step="1"></div>
    </span>
    <div class="sg"><span>SPEED</span><input type="range" id="speedSl" min="1" max="10" value="7" step="1"></div>
    <div class="vd"></div>
    <span class="row-lbl">SIZE</span>
    <button class="t" id="sizeSmallBtn" onclick="setVisualSize('small')">SMALL</button>
    <div class="vd"></div>
    <button class="t" id="sizeMediumBtn" onclick="setVisualSize('medium')">MEDIUM</button>
    <div class="vd"></div>
    <button class="t" id="sizeLargeBtn" onclick="setVisualSize('large')">LARGE</button>
    <div class="vd"></div>
    <button class="t on" id="size3xBtn" onclick="setVisualSize('3x')">3X</button>
  </div>

  <!-- Bio pixel size row -->
  <div class="row" id="bio-size-row" style="display:none">
    <span class="row-lbl">PIXEL SIZE</span>
    <button class="t on" id="bps1" onclick="setBioPixelSize(1)">1×</button>
    <div class="vd"></div>
    <button class="t" id="bps2" onclick="setBioPixelSize(2)">2×</button>
    <div class="vd"></div>
    <button class="t" id="bps3" onclick="setBioPixelSize(3)">3×</button>
    <div class="vd"></div>
    <button class="t" id="bps4" onclick="setBioPixelSize(4)">4×</button>
  </div>

  <!-- Metal sliders row: always in DOM, shown when metal mode active -->
  <div class="row" id="metal-sliders-row" style="display:none">
    <span class="row-lbl">PARAMS</span>
    <div class="sg">
      <span>NOISE</span>
      <input type="range" id="noiseSl" min="1" max="100" value="35" step="1">
      <span class="val" id="noiseVal">1.16</span>
    </div>
    <div class="vd"></div>
    <div class="sg">
      <span>DISPLACE</span>
      <input type="range" id="dispSl" min="1" max="100" value="45" step="1">
      <span class="val" id="dispVal">0.45</span>
    </div>
    <div class="vd"></div>
    <div class="sg">
      <span>FRACTAL</span>
      <input type="range" id="fractSl" min="1" max="8" value="3" step="1">
      <span class="val" id="fractVal">3</span>
    </div>
    <div class="vd"></div>
    <div class="sg">
      <span>ROUGH</span>
      <input type="range" id="roughSl" min="0" max="100" value="56" step="1">
      <span class="val" id="roughVal">0.56</span>
    </div>
    <div class="vd"></div>
    <div class="sg">

function getTextureKey(){

function currentPalette(){

function paletteRGB(v){
  var palette = currentPalette();
  v = Math.max(0, Math.min(1, v));
  var scaled = v * (palette.length - 1);
  var i = Math.floor(scaled);
  var f = scaled - i;
  var c1 = palette[i];
  var c2 = palette[Math.min(palette.length - 1, i + 1)];

  return [
    Math.round(c1[0] + (c2[0] - c1[0]) * f),
    Math.round(c1[1] + (c2[1] - c1[1]) * f),
    Math.round(c1[2] + (c2[2] - c1[2]) * f)
  ];
}

function paletteColor(v, alpha){
  if(alpha === undefined) alpha = 1;
  var c = paletteRGB(v);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
}

function paletteHslFallback(h, s, l, a){
  var t = (((h || 0) % 360) + 360) % 360 / 360;
  var lightBoost = Math.max(0, Math.min(1, (l || 50) / 100));
  var c = paletteRGB(t);

  var mix = 0.48 + lightBoost * 0.55;
  c = [
    Math.round(c[0] * mix + 255 * Math.max(0, lightBoost - 0.82) * 0.75),
    Math.round(c[1] * mix + 255 * Math.max(0, lightBoost - 0.82) * 0.75),
    Math.round(c[2] * mix + 255 * Math.max(0, lightBoost - 0.82) * 0.75)
  ];

  if(getTextureKey() === 'vintage'){
    c = [
      Math.round(c[0] * 0.90 + 18),
      Math.round(c[1] * 0.84 + 16),
      Math.round(c[2] * 0.68 + 10)
    ];
  }

  return 'rgba(' + Math.min(255,c[0]) + ',' + Math.min(255,c[1]) + ',' + Math.min(255,c[2]) + ',' + (a === undefined ? 1 : a) + ')';
}

  if(key === 'fire') return 1.35;
  if(key === 'prism') return 1.25;
  if(key === 'vintage') return 0.72;

}

  setMode(autoVJModes[autoVJIndex]);
}

  autoVJActive = !!active;

    var currentIndex = autoVJModes.indexOf(MODE);
    autoVJIndex = currentIndex >= 0 ? currentIndex : 0;

  }

        var edgeFade = Math.max(0, 1.0 - d * 0.85);
        v = Math.max(0, Math.min(1, v * (0.58 + edgeFade * 0.58) + bass * 0.18));

        var idx = Math.max(0, Math.min(chars.length - 1, Math.floor(v * (chars.length - 1))));
        var ch = chars.charAt(idx);

        // Skip very dim cells for performance and better contrast.
        if(idx < 1 && ((gx + gy) % 2 === 0)) continue;

        ctx.fillStyle = paletteColor((v + d * 0.45 + time * 0.04) % 1, 0.18 + v * 0.68);
        ctx.fillText(ch, x, y);
      }
    }

    // A few smooth scanlines for motion polish.
    ctx.globalCompositeOperation='screen';
    for(var s=0; s<4; s++){
      var sy = (h * ((time * 0.06 + s * 0.25) % 1));
      var grad = ctx.createLinearGradient(0, sy - cell * 2.0, 0, sy + cell * 2.0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.5, paletteColor((s / 4 + time * 0.08) % 1, 0.08 + high * 0.10));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, sy - cell * 2.0, w, cell * 4.0);
    }

    ctx.restore();
    ctx.shadowBlur = 0;
  }

if(MODE==='pulse'){
    // Paper Heatmap-inspired cube mode.
    // Audio input controls cube speed, scale, contour intensity, and glow.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation = 'lighter';

    var time = t * (0.55 + spd * 1.15 + bass * 2.35 + mid * 0.8);
    var minDim = Math.min(w, h);
    var cubeScale = 0.58 + bass * 0.38 + mid * 0.16;
    var cubeSize = minDim * cubeScale;
    var half = cubeSize * 0.5;
    var cx2 = cx + Math.sin(time * 0.42) * minDim * 0.025 * high;
    var cy2 = cy + Math.cos(time * 0.36) * minDim * 0.025 * mid;
        // Reduced rotation responsiveness for smoother motion
    var rotate =
        time * (
            0.028 +
            high * 0.045 +
            bass * 0.02
        );
    var tilt = 0.46 + Math.sin(time * 0.7) * 0.08;

    function rot2(x, y, a){
      var ca = Math.cos(a), sa = Math.sin(a);
      return { x: x * ca - y * sa, y: x * sa + y * ca };
    }

    function projectCube(x, y, z){
      var r = rot2(x, z, rotate);
      var px = r.x;
      var depth = r.y;
      var py = y - depth * tilt;
      var perspective = 1.0 / (1.0 + depth / (cubeSize * 2.15));
      return { x: cx2 + px * perspective, y: cy2 + py * perspective, d: depth };
    }

    function heatColor(value, alpha){
        return paletteColor(value, alpha);
    }

    var pts = [
      projectCube(-half, -half, -half), projectCube( half, -half, -half),
      projectCube( half,  half, -half), projectCube(-half,  half, -half),
      projectCube(-half, -half,  half), projectCube( half, -half,  half),
      projectCube( half,  half,  half), projectCube(-half,  half,  half)
    ];

    var faces = [
      [0,1,2,3,0.88], [4,5,6,7,1.08], [0,4,7,3,0.78],
      [1,5,6,2,0.9],  [0,1,5,4,1.0],  [3,2,6,7,0.72]
    ];

    faces.sort(function(a,b){
      var da = pts[a[0]].d + pts[a[1]].d + pts[a[2]].d + pts[a[3]].d;
      var db = pts[b[0]].d + pts[b[1]].d + pts[b[2]].d + pts[b[3]].d;
      return db - da;
    });

    var glow = ctx.createRadialGradient(cx2, cy2, cubeSize * 0.05, cx2, cy2, cubeSize * (0.76 + bass * 0.24));
    glow.addColorStop(0.0, heatColor(0.92, 0.22 + bass * 0.22));
    glow.addColorStop(0.42, heatColor(0.55 + mid * 0.25, 0.12));
    glow.addColorStop(1.0, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx2, cy2, cubeSize, 0, Math.PI * 2);
    ctx.fill();

    for(var fIndex=0; fIndex<faces.length; fIndex++){
      var face = faces[fIndex];
      var p0 = pts[face[0]], p1 = pts[face[1]], p2 = pts[face[2]], p3 = pts[face[3]];
      var faceHeat = 0.5 + 0.5 * Math.sin(time * 2.0 + fIndex * 0.85 + bass * 3.5);
      var contour = 0.5 + 0.5 * Math.sin(time * 3.2 + fIndex * 1.7 + mid * 4.0);
      var heat = Math.max(0, Math.min(1, faceHeat * 0.72 + contour * 0.28));
      var grad = ctx.createLinearGradient(p0.x, p0.y, p2.x, p2.y);
      grad.addColorStop(0.0, heatColor((heat + time * 0.08) % 1, 0.20 * face[4]));
      grad.addColorStop(0.48, heatColor((heat + 0.27 + bass * 0.25) % 1, 0.44 * face[4]));
      grad.addColorStop(1.0, heatColor((heat + 0.58 + high * 0.2) % 1, 0.22 * face[4]));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = heatColor(0.78 + bass * 0.2, 0.34 + high * 0.3);
      ctx.lineWidth = (1.0 + bass * 4.4) * vizDpr;
      ctx.stroke();
    }

    var lines = 18;
    for(var li=0; li<lines; li++){
      var u = li / (lines - 1);
      var y = -half + cubeSize * u;
      var wave = Math.sin(u * Math.PI * 8.0 + time * 3.4) * cubeSize * (0.018 + bass * 0.035);
      var a1 = projectCube(-half + wave, y, half);
      var a2 = projectCube( half + wave, y + Math.sin(time + u * 6.0) * cubeSize * 0.025, half);
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y);
      ctx.strokeStyle = heatColor((u + time * 0.12 + bass * 0.22) % 1, 0.26 + high * 0.32);
      ctx.lineWidth = (0.75 + mid * 2.6) * vizDpr;
      ctx.stroke();
    }

    var particles = IS_MOBILE ? 70 : 130;
    for(var pi=0; pi<particles; pi++){
      var seed = pi * 12.9898;
      var angle = seed + time * (0.5 + high);
      var radius = cubeSize * (0.24 + 0.55 * ((Math.sin(seed * 1.7 + time) + 1) * 0.5));
      var px = cx2 + Math.cos(angle) * radius;
      var py = cy2 + Math.sin(angle * 0.82) * radius * 0.7;
      var pr = (1.2 + Math.sin(seed + time * 4.0) * 1.0 + bass * 5.0) * vizDpr;
      ctx.fillStyle = heatColor((pi / particles + time * 0.08) % 1, 0.10 + high * 0.35);
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.6, pr), 0, Math.PI * 2);
      ctx.fill();
    }
  }


  ctx.restore();
}

  // On iOS WebKit, range inputs inside fixed/scroll containers sometimes
  // fail to receive touchmove. We manually compute value from touch position.
  (function() {
    var active = null;
    function sliderFromTouch(slider, clientX) {
      var rect = slider.getBoundingClientRect();
      var min = parseFloat(slider.min) || 0;
      var max = parseFloat(slider.max) || 100;
      var ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      var step = parseFloat(slider.step) || 1;
      var raw = min + ratio * (max - min);
      var snapped = Math.round(raw / step) * step;
      return Math.min(max, Math.max(min, snapped));
    }
    document.addEventListener('touchstart', function(e) {
      var el = e.target;
      if (el.tagName === 'INPUT' && el.type === 'range') {
        active = el;
        el.value = sliderFromTouch(el, e.touches[0].clientX);
        el.dispatchEvent(new Event('input', { bubbles: true }));
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener('touchmove', function(e) {
      if (!active) return;
      active.value = sliderFromTouch(active, e.touches[0].clientX);
      active.dispatchEvent(new Event('input', { bubbles: true }));
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', function(e) {
      if (!active) return;
      active.dispatchEvent(new Event('change', { bubbles: true }));
      active = null;
    }, { passive: true });
  })();

  // Wire up sliders

  }

  var fieldsSizeSlider = document.getElementById('fieldsSizeSl');
  if (fieldsSizeSlider) {
    fieldsSizeSlider.addEventListener('input', updateFieldsTextSize);
    fieldsSizeSlider.addEventListener('change', updateFieldsTextSize);
    updateFieldsTextSize();
    window.addEventListener('resize', updateFieldsTextSize);
    window.addEventListener('orientationchange', function(){ setTimeout(updateFieldsTextSize, 150); });
  }






  var micGainSlider = document.getElementById('micGainSl');
  if (micGainSlider) {
    function updateMicGainFromSlider() {
      MIC_GAIN = parseInt(micGainSlider.value, 10) / 100;
      if (micGainNode && micGainNode.gain) micGainNode.gain.value = MIC_GAIN;
      var micGainVal = document.getElementById('micGainVal');
      if (micGainVal) micGainVal.textContent = MIC_GAIN.toFixed(2) + 'x';
    }
    micGainSlider.addEventListener('input', updateMicGainFromSlider);
    micGainSlider.addEventListener('change', updateMicGainFromSlider);
    updateMicGainFromSlider();
  }



  function sliderVal(id, scale, decimals, outId) {
    document.getElementById(id).addEventListener('input', function(e) {
      var v = parseInt(e.target.value) * scale;
      document.getElementById(outId).textContent = v.toFixed(decimals);
      return v;
    });
  }
  document.getElementById('noiseSl').addEventListener('input', function(e) {
    M_NOISE = parseInt(e.target.value) / 30.0;
    document.getElementById('noiseVal').textContent = M_NOISE.toFixed(2);
  });
  document.getElementById('dispSl').addEventListener('input', function(e) {
    M_DISP = parseInt(e.target.value) / 100.0;
    document.getElementById('dispVal').textContent = M_DISP.toFixed(2);
  });
  document.getElementById('fractSl').addEventListener('input', function(e) {
    M_FRACT = parseInt(e.target.value);
    document.getElementById('fractVal').textContent = M_FRACT;
  });
  document.getElementById('roughSl').addEventListener('input', function(e) {
    M_ROUGH = parseInt(e.target.value) / 100.0;

  document.getElementById('metalSl').addEventListener('input', function(e) {

    document.getElementById('metalVal').textContent = M_METAL.toFixed(2);
  });
// Mic
  document.getElementById('mic-btn').addEventListener('click', function() {
    if (micActive) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Mic requires a secure HTTPS page or localhost. In Framer, publish/preview over HTTPS and allow microphone access.');
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true,video:false})
      .then(function(stream) {
        var ctx = new (window.AudioContext||window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        var src = ctx.createMediaStreamSource(stream);
        micGainNode = ctx.createGain();
        micGainNode.gain.value = MIC_GAIN;
        analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.82;
        src.connect(micGainNode);
        micGainNode.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        micActive = true;
        document.getElementById('mic-btn').textContent = 'MIC LIVE';
        document.getElementById('mic-btn').classList.add('live');
        document.getElementById('mic-dot').classList.add('live');
      })
      .catch(function(err) {
        var msg = location.protocol==='file:' ?
          'Mic requires HTTPS or localhost. In Framer, publish or preview over HTTPS and allow microphone access.' :
          'Mic denied: ' + err.message;
        alert(msg);
        document.getElementById('mic-btn').textContent='DENIED';
      });
  });


if (window.visualViewport) {

}

function initGL() {
// ───────────────────────────────────────────────────────────────────
// SHADERS
// ───────────────────────────────────────────────────────────────────

function compileShader(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function makeProgram(vsrc, fsrc) {
  var p = gl.createProgram();
  var vs = compileShader(gl.VERTEX_SHADER, vsrc);
  var fs = compileShader(gl.FRAGMENT_SHADER, fsrc);
  if(!vs || !fs) return null;
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

// ── SIMPLEX NOISE (shared by both sphere shaders) ──────────────────
var SNOISE_GLSL = `
vec3 _m3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 _m4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 _pm(vec4 x){return _m4(((x*34.)+1.)*x);}
vec4 _ts(vec4 r){return 1.79284291-0.85373472*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);
  const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz),l=1.-g;
  vec3 i1=min(g.xyz,l.zxy),i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx,x2=x0-i2+C.yyy,x3=x0-D.yyy;
  i=_m3(i);
  vec4 p=_pm(_pm(_pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z),y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy,y=y_*ns.x+ns.yyyy,h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy),b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.,s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy,a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x),p1=vec3(a0.zw,h.y),p2=vec3(a1.xy,h.z),p3=vec3(a1.zw,h.w);
  vec4 norm=_ts(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
  m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

// ── PERIODIC PERLIN NOISE (for metal sphere, Codrops-style) ────────
var PNOISE_GLSL = `
vec3 pm3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 pm4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 ppm(vec4 x){return pm4(((x*34.)+1.)*x);}
vec4 pts(vec4 r){return 1.79284291-0.85373472*r;}
float pnoise(vec3 P,vec3 rep){
  vec3 Pi0=mod(floor(P),rep),Pi1=mod(Pi0+1.,rep);
  Pi0=pm3(Pi0);Pi1=pm3(Pi1);
  vec3 Pf0=fract(P),Pf1=Pf0-1.;
  vec4 ix=vec4(Pi0.x,Pi1.x,Pi0.x,Pi1.x),iy=vec4(Pi0.yy,Pi1.yy);
  vec4 ixy=ppm(ppm(ix)+iy);
  vec4 ixy0=ppm(ixy+Pi0.zzzz),ixy1=ppm(ixy+Pi1.zzzz);
  vec4 gx0=ixy0/7.,gy0=fract(floor(gx0)/7.)-.5;gx0=fract(gx0);
  vec4 gz0=vec4(.5)-abs(gx0)-abs(gy0);vec4 sz0=step(gz0,vec4(0.));
  gx0-=sz0*(step(0.,gx0)-.5);gy0-=sz0*(step(0.,gy0)-.5);
  vec4 gx1=ixy1/7.,gy1=fract(floor(gx1)/7.)-.5;gx1=fract(gx1);
  vec4 gz1=vec4(.5)-abs(gx1)-abs(gy1);vec4 sz1=step(gz1,vec4(0.));
  gx1-=sz1*(step(0.,gx1)-.5);gy1-=sz1*(step(0.,gy1)-.5);
  vec3 g000=vec3(gx0.x,gy0.x,gz0.x),g100=vec3(gx0.y,gy0.y,gz0.y);
  vec3 g010=vec3(gx0.z,gy0.z,gz0.z),g110=vec3(gx0.w,gy0.w,gz0.w);
  vec3 g001=vec3(gx1.x,gy1.x,gz1.x),g101=vec3(gx1.y,gy1.y,gz1.y);
  vec3 g011=vec3(gx1.z,gy1.z,gz1.z),g111=vec3(gx1.w,gy1.w,gz1.w);
  vec4 n0=pts(vec4(dot(g000,g000),dot(g010,g010),dot(g100,g100),dot(g110,g110)));
  g000*=n0.x;g010*=n0.y;g100*=n0.z;g110*=n0.w;
  vec4 n1=pts(vec4(dot(g001,g001),dot(g011,g011),dot(g101,g101),dot(g111,g111)));
  g001*=n1.x;g011*=n1.y;g101*=n1.z;g111*=n1.w;
  vec3 fade_xyz=Pf0*Pf0*Pf0*(Pf0*(Pf0*6.-15.)+10.);
  vec4 nz=mix(vec4(dot(g000,Pf0),dot(g100,vec3(Pf1.x,Pf0.yz)),dot(g010,vec3(Pf0.x,Pf1.y,Pf0.z)),dot(g110,vec3(Pf1.xy,Pf0.z))),
              vec4(dot(g001,vec3(Pf0.xy,Pf1.z)),dot(g101,vec3(Pf1.x,Pf0.y,Pf1.z)),dot(g011,vec3(Pf0.x,Pf1.yz)),dot(g111,Pf1)),fade_xyz.z);
  vec2 ny=mix(nz.xy,nz.zw,fade_xyz.y);
  return 2.2*mix(ny.x,ny.y,fade_xyz.x);
}
vec3 rotateY(vec3 v,float a){float c=cos(a),s=sin(a);return vec3(c*v.x+s*v.z,v.y,-s*v.x+c*v.z);}`;

// ══════════════════════════════════════════════════════════════════
// 1. ORB BLOB — original simplex noise with varyings for color
// ══════════════════════════════════════════════════════════════════
var ORB_VS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform float uTime,uBass,uMid,uHigh,uDetail,uSpeed,uIdle;
uniform mat4  uMVP;
varying vec3 vN;
varying vec3 vP;
varying float vWave;
` + SNOISE_GLSL + `
void main(){
  float t=uTime*(0.25+uSpeed*0.15);
  float bass=uIdle>.5?.08:uBass, mid=uIdle>.5?.04:uMid, high=uIdle>.5?.02:uHigh;
  float d=uDetail;
  float n1=snoise(aNorm*d+t*.4);
  float n2=snoise(aNorm*d*2.1+t*.7+1.3);
  float n3=snoise(aNorm*d*4.2+t*1.3+2.7);
  float disp=n1*bass*2.6+n2*mid*1.3+n3*high*.6;
  disp+=snoise(aNorm*1.4+t*.12)*.2;
  vec3 p=aPos+aNorm*disp;
  vN=normalize(aNorm);
  vP=p;
  vWave=n1*.55+n2*.3+n3*.15;
  gl_Position=uMVP*vec4(p,1.);
}`;

var ORB_FS = `
precision highp float;
uniform float uTime,uFreq,uBass,uHigh,uIdle;
uniform int uTex;
varying vec3 vN;
varying vec3 vP;
varying float vWave;

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){
  return a + b*cos(6.28318*(c*t+d));
}

void main(){
  float f=uIdle>.5?(sin(uTime*.38)*.5+.5)*.28:uFreq;
  float bass=uIdle>.5?.05:uBass;
  float high=uIdle>.5?.02:uHigh;
  float t=uTime*.13;

  vec3 n=normalize(vN);
  vec3 p=normalize(vP);

  // Spatial color drivers create the glossy multi-color orb look:
  // vertical cyan/top, warm edges, magenta/violet base, and moving inner wave.
  float vertical=n.y*.5+.5;
  float horizontal=n.x*.5+.5;
  float rim=pow(1.0-abs(n.z),2.2);
  float wave=sin((p.x*2.8+p.y*1.4+vWave*2.2)+uTime*.8)*.5+.5;
  float band=sin((p.y*5.2+p.x*2.6)+uTime*.55+bass*3.0)*.5+.5;

  vec3 c;

  if(uTex==0){
    // RAINBOW: cyan crown, orange/red rim, violet base, pearl wave through center.
    vec3 top=vec3(.02,.95,1.0);
    vec3 mid=vec3(.00,.95,.72);
    vec3 bottom=vec3(.78,.05,1.0);
    vec3 warm=vec3(1.0,.32,.03);
    vec3 pink=vec3(1.0,.02,.55);
    c=mix(bottom,mid,vertical);
    c=mix(c,top,smoothstep(.58,1.0,vertical));
    c=mix(c,warm,rim*(.45+.45*bass));
    c=mix(c,pink,horizontal*(1.0-vertical)*.45);
    c+=vec3(1.0,.88,.46)*pow(band,18.0)*(0.35+high);
  }
  else if(uTex==1){
    // FIRE: ember red, molten orange, yellow-white heat, smoky crimson shadows.
    vec3 ember=vec3(.10,.00,.02);
    vec3 red=vec3(.85,.03,.00);
    vec3 orange=vec3(1.0,.32,.02);
    vec3 gold=vec3(1.0,.78,.12);
    c=mix(ember,red,wave);
    c=mix(c,orange,smoothstep(.25,.8,vertical+rim*.4));
    c=mix(c,gold,pow(band,8.0)*(0.45+bass));
    c+=vec3(1.0,.18,.02)*rim*.35;
  }
  else if(uTex==2){
    // ELECTRIC: blue, cyan, ultraviolet, sharp white arcs.
    vec3 deep=vec3(.01,.02,.16);
    vec3 blue=vec3(.02,.18,1.0);
    vec3 cyan=vec3(.0,.95,1.0);
    vec3 violet=vec3(.62,.08,1.0);
    c=mix(deep,blue,wave);
    c=mix(c,cyan,vertical*.65+high*.3);
    c=mix(c,violet,(1.0-vertical)*.55+rim*.25);
    c+=vec3(.75,.95,1.0)*pow(band,16.0)*(0.28+high*1.2);
  }
  else if(uTex==3){
    // PRISM: translucent pearl with spectral bands.
    vec3 pearl=vec3(.74,.88,.96);
    vec3 cyan=vec3(.0,.95,1.0);
    vec3 mag=vec3(1.0,.05,.75);
    vec3 lime=vec3(.58,1.0,.18);
    vec3 amber=vec3(1.0,.55,.06);
    c=pearl*.42;
    c=mix(c,cyan,smoothstep(.45,1.0,vertical)*.55);
    c=mix(c,mag,(1.0-vertical)*.5);
    c+=lime*pow(sin(horizontal*6.28318+t)*.5+.5,5.0)*.28;
    c+=amber*pow(band,10.0)*.42;
  }
  else if(uTex==4){
    // NEON: acid green, hot pink, cyan and blacklight blue.
    vec3 dark=vec3(.0,.02,.035);
    vec3 acid=vec3(.3,1.0,.05);
    vec3 cyan=vec3(.0,.95,1.0);
    vec3 pink=vec3(1.0,.0,.62);
    c=mix(dark,cyan,vertical*.75);
    c=mix(c,acid,wave*.48+bass*.2);
    c=mix(c,pink,(1.0-vertical)*.5+rim*.35);
    c+=vec3(.8,1.0,.2)*pow(band,14.0)*(0.25+bass);
  }
  else {
    // VIOLET: purple, indigo, magenta, icy blue highlight.
    vec3 indigo=vec3(.06,.02,.22);
    vec3 purple=vec3(.35,.04,.78);
    vec3 violet=vec3(.72,.06,1.0);
    vec3 magenta=vec3(1.0,.02,.72);
    vec3 ice=vec3(.36,.9,1.0);
    c=mix(indigo,purple,wave);
    c=mix(c,violet,vertical*.62);
    c=mix(c,magenta,rim*.42+(1.0-vertical)*.25);
    c+=ice*pow(band,12.0)*(0.18+high);
  }

  // Glassy center glow + audio brightness.
  float centerGlow=smoothstep(.15,1.0,1.0-length(p.xy)*.45);
  c=mix(c,c+vec3(.2,.75,.9),centerGlow*.18);
  c*=0.72+f*.55+bass*.45+high*.25;

  gl_FragColor=vec4(c,1.);
}`;

// ══════════════════════════════════════════════════════════════════
// IRIS — Iridescent orb. Fullscreen-triangle shader adapted from
// reactbits.dev/backgrounds/iridescence + voice-reactive orb article.
// Rendered on the main WebGL canvas; audio drives amplitude & speed.
// ══════════════════════════════════════════════════════════════════
var IRIS_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

var IRIS_FS = `
precision highp float;
uniform float uTime;
uniform float uSpeed;
uniform float uBass;
uniform float uMid;
uniform float uHigh;
uniform float uIdle;
uniform float uTex;
uniform vec2  uResolution;
varying vec2 vUv;

// fBm noise for tie-dye texture inside the orb
float hash21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise2(vec2 p){
  vec2 i=floor(p); vec2 f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
}
float fbm2(vec2 p){
  float v=0.; float a=0.5;
  for(int i=0;i<5;i++){ v+=a*noise2(p); p*=2.; a*=0.5; }
  return v;
}

void main(){
  float mr = min(uResolution.x, uResolution.y);
  vec2 uv = (vUv * 2.0 - 1.0) * uResolution / mr;

  float idlePulse = uIdle > 0.5 ? sin(uTime * 0.9) * 0.5 + 0.5 : 0.0;
  // Dramatic bass expansion: cube root for wide dynamic range
  float bassNorm = uIdle > 0.5 ? idlePulse * 0.05 : pow(uBass, 0.5) * 0.55;

  // Fixed orb size with dramatic bass pulse
  float baseR = 0.65;
  float orbR = baseR + bassNorm;
  float dist = length(uv);
  float mask = smoothstep(orbR, orbR - 0.18, dist);
  if(mask < 0.001){ gl_FragColor = vec4(0.0); return; }

  // Tie-dye fBm texture inside orb
  float spd2 = uIdle > 0.5 ? 0.12 : (uSpeed * 0.5 + uBass * 0.4 + uMid * 0.15);
  vec2 p = uv * 2.2;
  float dtime = uTime * 0.065 * spd2;
  p.x -= dtime;
  float n1 = fbm2(p * 0.9 + vec2(dtime*0.45, 0.0));
  float n2 = fbm2(p * 1.4 - vec2(0.0, dtime*0.25));
  float n3 = fbm2(p * 2.0 + n1);
  p.y += sin(p.x*2.3 + n1*4.5)*0.28;
  p.x += cos(p.y*2.1 + n2*4.0)*0.22;
  float bands = sin(p.x*2.1 + p.y*1.1 + n1*4.2 + n2*2.2 + n3*0.8);
  float dye = smoothstep(0.08, 0.92, 0.5 + 0.5*bands + fbm2(p*1.1+dtime)*0.18);

  // Shared seven-texture palette system for IRIS
  // 0 Rainbow, 1 Fire, 2 Electric, 3 Prism, 4 Neon, 5 UV, 6 Vintage
  vec3 c0;
  vec3 c1;
  vec3 c2;
  vec3 c3;
  vec3 c4;
  vec3 c5;

  if(uTex < 0.5){
    // RAINBOW — true spectrum
    c0=vec3(1.0,0.0,0.0);
    c1=vec3(1.0,1.0,0.0);
    c2=vec3(0.0,1.0,0.0);
    c3=vec3(0.0,1.0,1.0);
    c4=vec3(0.0,0.0,1.0);
    c5=vec3(1.0,0.0,1.0);
  } else if(uTex < 1.5){
    // FIRE
    c0=vec3(0.0,0.0,0.0);
    c1=vec3(0.04,0.08,0.20);
    c2=vec3(0.0,0.47,1.0);
    c3=vec3(0.47,0.86,1.0);
    c4=vec3(1.0,0.82,0.47);
    c5=vec3(1.0,0.24,0.0);
  } else if(uTex < 2.5){
    // ELECTRIC
    c0=vec3(0.02,0.0,0.08);
    c1=vec3(0.14,0.08,0.35);
    c2=vec3(0.27,0.86,1.0);
    c3=vec3(0.78,1.0,0.31);
    c4=vec3(1.0,1.0,0.31);
    c5=vec3(1.0,0.16,0.0);
  } else if(uTex < 3.5){
    // PRISM
    c0=vec3(0.0,0.0,0.0);
    c1=vec3(0.24,0.47,1.0);
    c2=vec3(0.55,0.86,1.0);
    c3=vec3(0.78,0.71,1.0);
    c4=vec3(1.0,0.47,0.24);
    c5=vec3(1.0,1.0,1.0);
  } else if(uTex < 4.5){
    // NEON
    c0=vec3(0.08,0.08,0.08);
    c1=vec3(0.0,1.0,0.67);
    c2=vec3(0.0,0.86,1.0);
    c3=vec3(0.47,1.0,0.35);
    c4=vec3(0.47,0.24,1.0);
    c5=vec3(1.0,0.24,0.86);
  } else if(uTex < 5.5){
    // UV
    c0=vec3(0.0,0.0,0.0);
    c1=vec3(0.27,0.0,0.51);
    c2=vec3(0.47,0.0,1.0);
    c3=vec3(0.0,0.86,1.0);
    c4=vec3(1.0,0.0,0.86);
    c5=vec3(1.0,1.0,0.31);
  } else {
    // VINTAGE
    c0=vec3(0.06,0.10,0.27);
    c1=vec3(0.12,0.39,0.47);
    c2=vec3(0.31,0.67,0.59);
    c3=vec3(0.90,0.84,0.63);
    c4=vec3(1.0,0.71,0.24);
    c5=vec3(0.75,0.16,0.08);
  }

  // Tie-dye color blend with audio shift
  float audioLift = uIdle > 0.5 ? idlePulse * 0.2 : uBass * 0.7 + uMid * 0.3 + uHigh * 0.15;
  float colorShift = audioLift * 0.45 + sin(uTime * 0.08) * 0.05;
  float t2 = fract(dye + colorShift);
  vec3 col;
  if(t2 < 0.20)      col = mix(c0, c1, t2 / 0.20);
  else if(t2 < 0.40) col = mix(c1, c2, (t2 - 0.20) / 0.20);
  else if(t2 < 0.60) col = mix(c2, c3, (t2 - 0.40) / 0.20);
  else if(t2 < 0.80) col = mix(c3, c4, (t2 - 0.60) / 0.20);
  else               col = mix(c4, c5, (t2 - 0.80) / 0.20);

  // Audio brightness: dramatic range
  col = pow(col, vec3(0.78));
  col *= 0.85 + audioLift * 1.6;
  col = clamp(col, 0.0, 1.0);

  // Specular
  float spec = smoothstep(0.32, 0.0, length(uv - vec2(-0.22, 0.26))) * 0.5;
  col = clamp(col + spec, 0.0, 1.0);

  // Glow halo
  float glowDist = smoothstep(orbR + 0.55, orbR + 0.02, dist);
  float haloMask = glowDist * (1.0 - mask);
  vec3 haloCol = c3 * (0.3 + audioLift * 0.5);

  vec3 finalCol = col * mask + haloCol * haloMask;
  float finalAlpha = mask + haloMask * 0.65;
  gl_FragColor = vec4(finalCol, clamp(finalAlpha, 0.0, 1.0));
}`;

// ══════════════════════════════════════════════════════════════════
// 2. METAL SPHERE — Codrops DistortedSphere technique
//    Periodic pnoise + twist. vDistort drives PBR-style shading.
//    uNoiseStrength driven violently by audio.
// ══════════════════════════════════════════════════════════════════
var METAL_VS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform float uTime,uSpeed,uNoiseDensity,uNoiseStrength,uFrequency,uAmplitude;
uniform mat4  uMVP;
varying float vDistort;
varying vec3  vWorldNorm;
varying vec3  vViewPos;
varying vec3  vWorldPos;

vec3 pm3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 pm4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 ppm(vec4 x){return pm4(((x*34.)+1.)*x);}
vec4 pts(vec4 r){return 1.79284291-0.85373472*r;}
float pnoise(vec3 P,vec3 rep){
  vec3 Pi0=mod(floor(P),rep),Pi1=mod(Pi0+1.,rep);
  Pi0=pm3(Pi0);Pi1=pm3(Pi1);
  vec3 Pf0=fract(P),Pf1=Pf0-1.;
  vec4 ix=vec4(Pi0.x,Pi1.x,Pi0.x,Pi1.x),iy=vec4(Pi0.yy,Pi1.yy);
  vec4 ixy=ppm(ppm(ix)+iy);
  vec4 ixy0=ppm(ixy+Pi0.zzzz),ixy1=ppm(ixy+Pi1.zzzz);
  vec4 gx0=ixy0/7.,gy0=fract(floor(gx0)/7.)-.5;gx0=fract(gx0);
  vec4 gz0=vec4(.5)-abs(gx0)-abs(gy0);vec4 sz0=step(gz0,vec4(0.));
  gx0-=sz0*(step(0.,gx0)-.5);gy0-=sz0*(step(0.,gy0)-.5);
  vec4 gx1=ixy1/7.,gy1=fract(floor(gx1)/7.)-.5;gx1=fract(gx1);
  vec4 gz1=vec4(.5)-abs(gx1)-abs(gy1);vec4 sz1=step(gz1,vec4(0.));
  gx1-=sz1*(step(0.,gx1)-.5);gy1-=sz1*(step(0.,gy1)-.5);
  vec3 g000=vec3(gx0.x,gy0.x,gz0.x),g100=vec3(gx0.y,gy0.y,gz0.y);
  vec3 g010=vec3(gx0.z,gy0.z,gz0.z),g110=vec3(gx0.w,gy0.w,gz0.w);
  vec3 g001=vec3(gx1.x,gy1.x,gz1.x),g101=vec3(gx1.y,gy1.y,gz1.y);
  vec3 g011=vec3(gx1.z,gy1.z,gz1.z),g111=vec3(gx1.w,gy1.w,gz1.w);
  vec4 n0=pts(vec4(dot(g000,g000),dot(g010,g010),dot(g100,g100),dot(g110,g110)));
  g000*=n0.x;g010*=n0.y;g100*=n0.z;g110*=n0.w;
  vec4 n1=pts(vec4(dot(g001,g001),dot(g011,g011),dot(g101,g101),dot(g111,g111)));
  g001*=n1.x;g011*=n1.y;g101*=n1.z;g111*=n1.w;
  vec3 fv=Pf0*Pf0*Pf0*(Pf0*(Pf0*6.-15.)+10.);
  vec4 nz=mix(vec4(dot(g000,Pf0),dot(g100,vec3(Pf1.x,Pf0.yz)),dot(g010,vec3(Pf0.x,Pf1.y,Pf0.z)),dot(g110,vec3(Pf1.xy,Pf0.z))),
              vec4(dot(g001,vec3(Pf0.xy,Pf1.z)),dot(g101,vec3(Pf1.x,Pf0.y,Pf1.z)),dot(g011,vec3(Pf0.x,Pf1.yz)),dot(g111,Pf1)),fv.z);
  vec2 ny=mix(nz.xy,nz.zw,fv.y);
  return 2.2*mix(ny.x,ny.y,fv.x);
}
vec3 rotY(vec3 v,float a){float c=cos(a),s=sin(a);return vec3(c*v.x+s*v.z,v.y,-s*v.x+c*v.z);}

void main(){
  float t=uTime*uSpeed;
  float distortion=pnoise((aNorm+t)*uNoiseDensity,vec3(10.)*uNoiseDensity)*uNoiseStrength;
  float angle=sin(aPos.y*uFrequency+t)*uAmplitude;
  vec3 pos=aPos+aNorm*distortion;
  pos=rotY(pos,angle);
  vDistort=distortion;
  // Pass world-space position and normal for env reflection in FS
  vWorldPos=pos;
  vWorldNorm=normalize(aNorm+vec3(distortion)*0.15); // perturbed normal
  // View-space position for Fresnel
  vViewPos=vec3(0.,0.,14.)-pos;
  gl_Position=uMVP*vec4(pos,1.);
}`;

var METAL_FS = `
precision highp float;
uniform float uTime,uBass,uMid,uHigh,uIdle,uNoiseStrength,uRoughness,uMetalness;
uniform int uMetalType;
varying float vDistort;
varying vec3  vWorldNorm;
varying vec3  vViewPos;
varying vec3  vWorldPos;
#define PI 3.14159265358979

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){
  return a + b*cos(6.28318*(c*t+d));
}
float sat(float x){return clamp(x,0.0,1.0);}

void main(){
  float bass=uIdle>.5?.03:uBass;
  float mid =uIdle>.5?.02:uMid;
  float high=uIdle>.5?.02:uHigh;

  vec3 N = normalize(vWorldNorm);
  vec3 V = normalize(vViewPos);
  float NdV = max(dot(N,V),0.001);
  float fresnel = pow(1.0 - NdV, 3.0);
  float d = sat(vDistort / max(uNoiseStrength,0.001) * 0.5 + 0.5);

  vec3 L1 = normalize(vec3(-1.0,1.4,1.2));
  vec3 L2 = normalize(vec3(1.3,.45,.65));
  vec3 L3 = normalize(vec3(.0,.35,-1.0));

  float key = pow(max(dot(reflect(-V,N), L1),0.0), mix(90.0,18.0,uRoughness));
  float fill = pow(max(dot(reflect(-V,N), L2),0.0), mix(45.0,10.0,uRoughness));
  float rimLight = pow(max(dot(reflect(-V,N), L3),0.0), 8.0);

  // Per-type vivid palettes: 0=glass/prism, 1=fire, 2=electric, 3=prism, 4=neon, 5=violet/rainbow
  float rt = vWorldPos.y*.22+vWorldPos.x*.14+vDistort*4.0+uTime*.20;
  vec3 albedo = vec3(.88,.92,1.0);  // type 0: CHROME glass

  if(uMetalType==1){
    // FIRE: deep orange-red core → yellow-white hot tip
    float ft = sat(vDistort*3.+.5+bass*2.);
    albedo = mix(vec3(0.7,0.05,0.0), mix(vec3(1.0,0.38,0.0),vec3(1.0,0.95,0.3),ft*ft), ft);
  }
  else if(uMetalType==2){
    // ELECTRIC: neon purple → electric green
    float et = sat(sin(rt*4.+uTime*.4)*.5+.5+vDistort*2.);
    albedo = mix(vec3(0.5,0.0,1.0), vec3(0.1,1.0,0.2), et);
  }
  else if(uMetalType==3){
    // PRISM: glass iridescence — white core, rainbow edge
    float pt2 = sat(length(N.xy)*.8+vDistort*2.);
    albedo = pal(pt2+rt*.3, vec3(.85,.88,1.0), vec3(.12,.10,.12), vec3(1.0,1.0,1.0), vec3(0.,.33,.67));
    albedo = mix(vec3(.9,.95,1.0), albedo, pt2*.8+.2);
  }
  else if(uMetalType==4){
    // NEON: dark base with UV cyan-magenta glow
    float nt = sat(vDistort*3.+bass*3.+.3);
    albedo = mix(vec3(0.01,0.0,0.04), mix(vec3(0.0,0.85,0.8),vec3(0.9,0.0,0.6),sin(rt*3.)*.5+.5), nt);
  }
  else if(uMetalType==5){
    // VIOLET: deep purple → pink → cobalt
    albedo = pal(rt, vec3(.55,.0,.7), vec3(.45,.3,.3), vec3(1.0,.8,1.0), vec3(.0,.15,.4));
  }

  // metal lighting, kept intentionally simple to avoid shader compatibility problems
  vec3 envTop = mix(vec3(.08,.10,.16), vec3(.68,.82,1.0), sat(N.y*.5+.5));
  vec3 envWarm = vec3(1.0,.58,.28) * pow(max(dot(reflect(-V,N), normalize(vec3(-.8,.2,1.0))),0.0), 22.0);
  vec3 spec = vec3(1.0) * key * (1.1 + uMetalness);
  spec += vec3(.45,.65,1.0) * fill * .65;

  col = mix(col, col + pal(d + uTime*.05, vec3(.35), vec3(.25), vec3(1.0), vec3(.0,.33,.67)), (mid+high)*.12);

  if(uMetalType==4){
    col *= .55;
    col += vec3(.08,.10,.16)*fresnel;
  }

  col *= .72;
  col = (col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);
  col = pow(max(col,vec3(0.0)),vec3(1.0/2.2));
  gl_FragColor=vec4(col,1.0);
}`;

// ── Compile programs ───────────────────────────────────────────────
var orbProg   = makeProgram(ORB_VS,   ORB_FS);
var metalProg = makeProgram(METAL_VS, METAL_FS);
var irisProg  = makeProgram(IRIS_VS,  IRIS_FS);

// Fullscreen triangle (covers NDC [-1,1] with a single triangle)
var irisTriBuf = mkBuf(new Float32Array([-1,-1, 3,-1, -1,3]), gl.ARRAY_BUFFER);
if(!orbProg || !metalProg){
  console.error('Visualizer shader program failed. Falling back to 2D OSC mode.');
  setTimeout(function(){ setMode('osc'); }, 0);
}

// ── Geometry: icosahedron sphere ───────────────────────────────────
function buildSphere(subdivs) {
  var t=(1+Math.sqrt(5))/2;
  var v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  var f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  function norm(x){var l=Math.sqrt(x[0]*x[0]+x[1]*x[1]+x[2]*x[2]);return[x[0]/l,x[1]/l,x[2]/l];}
  v=v.map(norm);
  for(var s=0;s<subdivs;s++){
    var nf=[],mc={};
    function mid(a,b){var k=Math.min(a,b)+','+Math.max(a,b);if(mc[k]!==undefined)return mc[k];var va=v[a],vb=v[b];mc[k]=v.length;v.push(norm([(va[0]+vb[0])/2,(va[1]+vb[1])/2,(va[2]+vb[2])/2]));return v.length-1;}
    f.forEach(function(x){var a=mid(x[0],x[1]),b=mid(x[1],x[2]),c=mid(x[2],x[0]);nf.push([x[0],a,c],[x[1],b,a],[x[2],c,b],[a,b,c]);});
    f=nf;
  }
  var pos=[],nor=[],tri=[],wire=[];
  f.forEach(function(x){
    var base=pos.length/3;
    for(var i=0;i<3;i++){var vi=v[x[i]];pos.push(vi[0]*4,vi[1]*4,vi[2]*4);nor.push(vi[0],vi[1],vi[2]);}
    tri.push(base,base+1,base+2);
    wire.push(base,base+1,base+1,base+2,base+2,base);
  });
  return{pos:new Float32Array(pos),nor:new Float32Array(nor),tri:new Uint16Array(tri),wire:new Uint16Array(wire)};
}
var geo=buildSphere(3);

function mkBuf(data, target) {
  var b=gl.createBuffer();
  gl.bindBuffer(target,b);
  gl.bufferData(target,data,gl.STATIC_DRAW);
  return b;
}
var posBuf  = mkBuf(geo.pos,  gl.ARRAY_BUFFER);
var norBuf  = mkBuf(geo.nor,  gl.ARRAY_BUFFER);
var triBuf  = mkBuf(geo.tri,  gl.ELEMENT_ARRAY_BUFFER);
var wireBuf = mkBuf(geo.wire, gl.ELEMENT_ARRAY_BUFFER);
var quadBuf = mkBuf(new Float32Array([0,0,1,0,0,1,1,1]), gl.ARRAY_BUFFER);

// ── Cache uniform + attribute locations ───────────────────────────
function ulocs(p, names) {
  var o={};
  if(!p) return o;
  names.forEach(function(n){o[n]=gl.getUniformLocation(p,n);});
  return o;
}
var oU = ulocs(orbProg,   ['uTime','uBass','uMid','uHigh','uFreq','uDetail','uSpeed','uIdle','uTex','uMVP']);
var mU = ulocs(metalProg, ['uTime','uBass','uMid','uHigh','uIdle','uSpeed','uNoiseDensity','uNoiseStrength','uFrequency','uAmplitude','uRoughness','uMetalness','uMetalType','uMVP']);
var iU = ulocs(irisProg,  ['uTime','uSpeed','uBass','uMid','uHigh','uIdle','uResolution','uTex']); // uTex is float now

var oAPos=orbProg?gl.getAttribLocation(orbProg,'aPos'):-1,   oANorm=orbProg?gl.getAttribLocation(orbProg,'aNorm'):-1;
var mAPos=metalProg?gl.getAttribLocation(metalProg,'aPos'):-1,  mANorm=metalProg?gl.getAttribLocation(metalProg,'aNorm'):-1;
var iAPos=irisProg?gl.getAttribLocation(irisProg,'aPos'):-1;

console.log('Locations — orb aPos:',oAPos,'aNorm:',oANorm,'| metal aPos:',mAPos,'aNorm:',mANorm);

// ── Matrix math (column-major WebGL) ──────────────────────────────
function m4mul(a,b){
  var o=new Float32Array(16);
  for(var col=0;col<4;col++)for(var row=0;row<4;row++){var s=0;for(var k=0;k<4;k++)s+=a[k*4+row]*b[col*4+k];o[col*4+row]=s;}
  return o;
}
function mPersp(fov,asp,n,f){
  var ff=1/Math.tan(fov*.5),nf=1/(n-f);
  return new Float32Array([ff/asp,0,0,0, 0,ff,0,0, 0,0,(f+n)*nf,-1, 0,0,2*f*n*nf,0]);
}
function mView(ex,ey,ez){
  var fx=-ex,fy=-ey,fz=-ez,fl=Math.sqrt(fx*fx+fy*fy+fz*fz);
  if(fl<.0001)fl=.0001;fx/=fl;fy/=fl;fz/=fl;
  var rx=fz,ry=0,rz=-fx,rl=Math.sqrt(rx*rx+rz*rz);
  if(rl<.0001){rx=1;rz=0;}else{rx/=rl;rz/=rl;}
  var ux=ry*fz-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy-ry*fx;
  return new Float32Array([rx,ux,-fx,0, ry,uy,-fy,0, rz,uz,-fz,0, -(rx*ex+ry*ey+rz*ez),-(ux*ex+uy*ey+uz*ez),(fx*ex+fy*ey+fz*ez),1]);
}
function mRotY(a){var c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);}

// ── Audio helpers ──────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t;}
function band(arr,s,e){var sum=0;for(var i=s;i<e;i++)sum+=arr[i];return sum/((e-s)*255);}

  // Number keys 1-0 + numpad switch modes
  var numModes=['ripple','liquidmetal','lightning','ascii','bio','orb','metal','osc','fft','lissajous','retrowave','star','iris','pulse','tiedye'];
  var numKey = null;
  if(e.key>='1'&&e.key<='9') numKey = parseInt(e.key)-1;
  if(e.key==='0') numKey = 9;
  if(e.code==='Minus'||e.key==='-') numKey = 10;
  if(e.code==='Equal'||e.key==='=') numKey = 11;
  // Numpad support
  if(e.code&&e.code.startsWith('Numpad')){
    var n=parseInt(e.code.replace('Numpad',''));
    if(!isNaN(n)){
      if(n>=1&&n<=9) numKey=n-1;
      if(n===0) numKey=9;

// ── Helper: bind sphere geometry ──────────────────────────────────
function bindSphereGeom(aPos, aNorm) {
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, norBuf);
  gl.enableVertexAttribArray(aNorm);
  gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);
}

// ── Helper: build MVP ─────────────────────────────────────────────
function buildMVP(t) {
  var aspect = canvas.width / canvas.height;
  var proj = mPersp(0.75, aspect, 0.1, 100);
  var camX = mx*0.5 + Math.sin(t*0.07)*0.3;
  var camY = -my*0.5;
  var view = mView(camX, camY-1.5, 14);
  var rot  = mRotY(t*0.025 + sBass*0.06);
  return m4mul(m4mul(proj, view), rot);
}

// ── RENDER LOOP ────────────────────────────────────────────────────
var t0=performance.now(), frame=0;

function animate(){
  if(!APP_VISIBLE && document.hidden){ requestAnimationFrame(animate); return; }
  requestAnimationFrame(animate);
  var t=(performance.now()-t0)/1000;
  frame++;

  // Audio
  if(analyser){
    analyser.getByteFrequencyData(dataArray);
    var bc=analyser.frequencyBinCount;
  
  // Mic gain is applied before the analyser through a Web Audio GainNode.
    // 0.00x = nearly frozen/no audio reaction, 1.00x = default, 3.00x = highly reactive.
    var bassIn = Math.min(1, band(dataArray,0,Math.floor(bc*.04)));
    var midIn  = Math.min(1, band(dataArray,Math.floor(bc*.04),Math.floor(bc*.25)));
    var highIn = Math.min(1, band(dataArray,Math.floor(bc*.25),Math.floor(bc*.75)));

    sBass=lerp(sBass,bassIn,.13);
    sMid =lerp(sMid, midIn,.10);
    sHigh=lerp(sHigh,highIn,.10);

    var raw=0;for(var i=0;i<bc;i++)raw+=dataArray[i];
    var rawGain = Math.min(1, raw/(bc*255));
    sFreq=lerp(sFreq,rawGain,.1);
    if(frame%6===0)document.getElementById('freq-val').textContent=Math.round(raw/bc);
  } else {
    sBass=lerp(sBass,0,.05);sMid=lerp(sMid,0,.05);sHigh=lerp(sHigh,0,.05);sFreq=lerp(sFreq,0,.05);
  }

  var idle  = micActive?0:1;
  var spd   = SPEED/10;
  var bloom = BLOOM/10;
  // Only run WebGL setup for GL modes (not 2D/bio/tiedye — saves ~5ms/frame)
  var isGLMode = (MODE==='orb'||MODE==='metal'||MODE==='iris');
  var mvp   = isGLMode ? buildMVP(t) : null;
  if(isGLMode){
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
  }

  // ── ORB BLOB ───────────────────────────────────────────────
  if(MODE==='orb' && orbProg){
    gl.useProgram(orbProg);
    bindSphereGeom(oAPos, oANorm);
    gl.uniformMatrix4fv(oU.uMVP,false,mvp);
    gl.uniform1f(oU.uTime,t);
    gl.uniform1f(oU.uBass,sBass); gl.uniform1f(oU.uMid,sMid); gl.uniform1f(oU.uHigh,sHigh);
    gl.uniform1f(oU.uFreq,sFreq); gl.uniform1f(oU.uDetail,DETAIL*.45+.4);
    gl.uniform1f(oU.uSpeed,spd+sBass*.6); gl.uniform1f(oU.uIdle,idle);
    gl.uniform1i(oU.uTex,TEX);
    if(WIRE){gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,wireBuf);gl.drawElements(gl.LINES,geo.wire.length,gl.UNSIGNED_SHORT,0);}
    else{gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,triBuf);gl.drawElements(gl.TRIANGLES,geo.tri.length,gl.UNSIGNED_SHORT,0);}
    // Bloom glow pass
    if(bloom>.05){
      gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
      var sc=1+bloom*.04;
      var gm=m4mul(mvp,new Float32Array([sc,0,0,0,0,sc,0,0,0,0,sc,0,0,0,0,1]));
      gl.uniformMatrix4fv(oU.uMVP,false,gm);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,wireBuf);
      gl.drawElements(gl.LINES,geo.wire.length,gl.UNSIGNED_SHORT,0);
      gl.disable(gl.BLEND);
    }
  }

  // ── METAL SPHERE ──────────────────────────────────────────
  if(MODE==='metal' && metalProg){
    // Slower metal audio easing: keeps the metal sphere heavy/smooth instead of jittery.
    mBassSm = lerp(mBassSm, sBass, 0.035);
    mMidSm  = lerp(mMidSm,  sMid,  0.03);
    mHighSm = lerp(mHighSm, sHigh, 0.025);
    mFreqSm = lerp(mFreqSm, sFreq, 0.03);

    gl.useProgram(metalProg);
    bindSphereGeom(mAPos, mANorm);
    gl.uniformMatrix4fv(mU.uMVP,false,mvp);
    gl.uniform1f(mU.uTime,t);
    gl.uniform1f(mU.uBass,mBassSm); gl.uniform1f(mU.uMid,mMidSm); gl.uniform1f(mU.uHigh,mHighSm);
    gl.uniform1f(mU.uIdle,idle);
    gl.uniform1f(mU.uSpeed,spd+mBassSm*.15);

    // Noise density from M_NOISE slider
    var density = M_NOISE * 1.5;
    // Base strength from M_DISP, audio violence on top
    var baseStr = M_DISP;
    var violence = micActive ? mBassSm*0.75+mMidSm*0.28+mHighSm*0.10 : 0;
    var strength = baseStr + violence * (M_DISP * 4.0);

    gl.uniform1f(mU.uNoiseDensity,  density);
    gl.uniform1f(mU.uNoiseStrength, strength);
    gl.uniform1f(mU.uFrequency,     2.0 + mBassSm*0.75 + M_FRACT*0.4);
    gl.uniform1f(mU.uAmplitude,     0.2 + mMidSm*0.18);
    gl.uniform1f(mU.uRoughness,     M_ROUGH);
    gl.uniform1f(mU.uMetalness,     M_METAL);
    gl.uniform1i(mU.uMetalType,M_TYPE);

    // Always draw solid triangles for metal (looks better)
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,triBuf);
    gl.drawElements(gl.TRIANGLES,geo.tri.length,gl.UNSIGNED_SHORT,0);

    // Bloom glow
    if(bloom>.05){
      gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
      var sc2=1+bloom*.03+mBassSm*.025;
      var gm2=m4mul(mvp,new Float32Array([sc2,0,0,0,0,sc2,0,0,0,0,sc2,0,0,0,0,1]));
      gl.uniformMatrix4fv(mU.uMVP,false,gm2);
      gl.uniform1f(mU.uNoiseStrength, strength*1.4);
      gl.drawElements(gl.TRIANGLES,geo.tri.length,gl.UNSIGNED_SHORT,0);
      gl.disable(gl.BLEND);
    }
  }



  // ── IRIS — iridescent orb ─────────────────────────────────
  if(MODE==='iris' && irisProg){
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(irisProg);

    // Bind fullscreen triangle
    gl.bindBuffer(gl.ARRAY_BUFFER, irisTriBuf);
    gl.enableVertexAttribArray(iAPos);
    gl.vertexAttribPointer(iAPos, 2, gl.FLOAT, false, 0, 0);

    var iSpeed = spd * (0.75 + (idle > 0.5 ? 0.0 : sBass * 0.5));

    gl.uniform1f(iU.uTime,      t);
    gl.uniform1f(iU.uSpeed,     iSpeed);
    gl.uniform1f(iU.uBass,      sBass);
    gl.uniform1f(iU.uMid,       sMid);
    gl.uniform1f(iU.uHigh,      sHigh);
    gl.uniform1f(iU.uIdle,      idle);
    gl.uniform2f(iU.uResolution, canvas.width, canvas.height);
    gl.uniform1f(iU.uTex, parseFloat(TEX));

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(iAPos);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
  }

  // ── BIOLUMINESCENCE ───────────────────────────────────────
  if(MODE==='bio' && typeof bioSim !== 'undefined'){
    try { bioSim.tick(t, sBass, sMid, sHigh, spd, bloom); }
    catch(e) { console.warn('bioSim.tick error:', e); }
  }

  // ── TIE DYE ──────────────────────────────────────────────
  if(MODE==='tiedye' && typeof tieDyeSim !== 'undefined'){
    try { tieDyeSim.tick(t, sBass, sMid, sHigh, spd); }
    catch(e) { console.warn('tieDyeSim.tick error:', e); }
  }

  // ── FLUID MODE ────────────────────────────────────────────
  if(MODE==='ripple'){
    // Compute beat: sharp transient when bass spikes
    var beatVal = sBass > 0.35 ? sBass * sBass : 0;
    fluid.tick(t, sBass, sMid, sHigh, beatVal);
  }

  if(['osc','fft','dots','lissajous','retrowave','star','pulse','liquidmetal','lightning','ascii'].indexOf(MODE)!==-1){
    drawExtraVisualizer(t, spd, bloom);
  }

}

updateAutoVJStatus();
setVisualSize('3x');
setMode('ripple');
animate();
} // end initGL
